[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "model-price-registry"
version = "0.1.0"
description = "Audited LLM prices with provider sync and a human approval queue (clean-room demo)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
api = ["fastapi>=0.110"]
dev = ["pytest>=8", "ruff>=0.5", "fastapi>=0.110", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/model_price_registry"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
